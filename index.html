<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Timing Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .modal-backdrop { display: none; pointer-events: none; }
    .modal-backdrop.active-modal { display: flex; pointer-events: auto; }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50">

  <header class="bg-rose-900 text-white p-4 sticky top-0 z-30">
    <h1 class="text-xl font-bold">Timing Test</h1>
  </header>

  <main class="flex-grow p-4">
    <button type="button" id="btnA" class="bg-rose-800 text-white px-4 py-3 rounded-lg text-sm font-bold">
      Button A (plain, no delegation)
    </button>
    <br><br>
    <button type="button" data-action="testB" class="bg-blue-800 text-white px-4 py-3 rounded-lg text-sm font-bold">
      Button B (delegation)
    </button>
    <div id="out" class="mt-4 p-3 bg-white rounded border">Output here</div>

    <button type="button" onclick="document.getElementById('btnA').click()" class="mt-4 bg-green-700 text-white px-4 py-3 rounded-lg text-sm font-bold">
      Button C — re-trigger A via .click()
    </button>
    <button type="button" id="btnD" class="mt-4 bg-amber-600 text-white px-4 py-3 rounded-lg text-sm font-bold">
      Button D — triggers silent reflow
    </button>
    <button type="button" id="btnE" class="mt-4 bg-purple-700 text-white px-4 py-3 rounded-lg text-sm font-bold">
      Button E — console.log only (check Safari console later)
    </button>
  </main>

  <div id="modal1" class="modal-backdrop fixed inset-0 bg-slate-900/60 z-50 items-center justify-center p-4">
    <div class="bg-white p-6 rounded-xl">Modal content</div>
  </div>

  <script>
    // Direct listener
    document.getElementById('btnA').addEventListener('click', function() {
      document.getElementById('out').textContent = 'Button A tapped at ' + new Date().toLocaleTimeString();
    });

    // Delegation listener (same pattern as app)
    document.addEventListener('click', function(e) {
      var el = e.target;
      while (el && el !== document.body) {
        if (el.dataset && el.dataset.action === 'testB') {
          document.getElementById('out').textContent = 'Button B tapped at ' + new Date().toLocaleTimeString();
          return;
        }
        el = el.parentElement;
      }
    });

    // Button D — silent reflow (no alert)
    document.getElementById('btnD').addEventListener('click', function() {
      void document.body.offsetHeight;
      void document.body.getBoundingClientRect();
      document.getElementById('out').textContent = 'Reflow done at ' + new Date().toLocaleTimeString() + ' — now try Button A/B';
    });

    // Button E — log only
    document.getElementById('btnE').addEventListener('click', function() {
      console.log('Button E clicked at', new Date().toISOString());
    });
  </script>
</body>
</html>
